<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Страница не найдена</title>
<style>
  :root { --bg: #f6f3ec; --card: #ffffff; --ink: #1f2430; --muted: #6b7280; --line: #ddd6c8; --a: #e4572e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #15171c; --card: #1f2229; --ink: #ece9e2; --muted: #9aa0aa; --line: #353a44; }
  }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box;
    background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 32px 24px; max-width: 420px; text-align: center; }
  .big { font-size: 64px; font-weight: 800; line-height: 1; }
  p { color: var(--muted); }
  a { display: inline-block; margin-top: 8px; padding: 12px 20px; border-radius: 12px; background: var(--a); color: #fff; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<main>
  <div class="big">404</div>
  <h1>Такой страницы нет</h1>
  <p>Возможно, урок ещё не готов или ссылка устарела.</p>
  <a href="/" id="home">← Ко всем урокам</a>
</main>
<script>
  // 404 открывается по любому адресу, поэтому путь к главной — от корня сайта.
  // На GitHub Pages сайт лежит в подпапке /<репозиторий>/, на своём домене или Cloudflare — в корне.
  if (location.hostname.endsWith('github.io')) document.getElementById('home').href = '/' + location.pathname.split('/')[1] + '/';
</script>
</body>
</html>
